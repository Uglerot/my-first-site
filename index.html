<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Музыкальные инструменты Китая</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Музыкальные инструменты Китая</h1>
</header>

<main>

    <div class="slider">

        <button id="prev" class="arrow">&#10094;</button>

        <div class="card">

            <img id="instrumentImage" src="images/guqin.jpg" alt="Музыкальный инструмент">

            <h2 id="instrumentName">Гуцинь</h2>

            <audio id="player" controls>
                <source src="audio/guqin.mp3" type="audio/mpeg">
                Ваш браузер не поддерживает аудио.
            </audio>

            <div id="instrumentInfo">
                Здесь будет описание музыкального инструмента.
            </div>

        </div>

        <button id="next" class="arrow">&#10095;</button>

    </div>

</main>

<footer>
    Проект ученика 11 класса
</footer>

<script src="script.js"></script>

</body>
</html>
